name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispatches workflow whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    name: Build Executable
    runs-on: windows-latest

    permissions:
      contents: write # Required to create the release and upload the .exe asset

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib seaborn pyinstaller

      - name: Build with PyInstaller
        run: |
          # Replace 'seu_script.py' with your actual Python script filename
          pyinstaller --onefile --name LTSpice_LOG_Parser --collect-all pandas --collect-all matplotlib --collect-all seaborn seu_script.py

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LTSpice_LOG_Parser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}