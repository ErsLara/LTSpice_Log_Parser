name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara o workflow sempre que você criar uma tag que começa com 'v' (ex: v1.0.0)

jobs:
  build:
    name: Build Executable
    runs-on: windows-latest

    permissions:
      contents: write # Necessário para criar a release e fazer upload do .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name LTSpice_LOG_Parser --collect-all pandas LTSpice_LOG_Parser.py

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LTSpice_LOG_Parser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}